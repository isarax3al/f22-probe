name: on-main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: run build script with secret in env
        run: bash build.sh
        env:
          FAKE_SECRET: ${{ secrets.FAKE_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
